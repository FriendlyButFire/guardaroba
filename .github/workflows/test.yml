name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches missing platforms itself.
      - run: ./gradlew :motore:test testDebugUnitTest
